[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire-lang"
version = "0.1.0"
description = "Sapphire programming language compiler and runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Zach Ziccardi" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "antlr4-python3-runtime>=4.13.0,<4.14.0",
    "pygls",
]

[project.optional-dependencies]
llvm = ["llvmlite"]

[project.urls]
Homepage = "https://zziccardi.github.io/sapphire/"
Repository = "https://github.com/zziccardi/sapphire"
"Bug Tracker" = "https://github.com/zziccardi/sapphire/issues"

[project.scripts]
sapphire = "sapphire.cli.sapphire:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sapphire*"]

[tool.setuptools.package-data]
"*" = ["*.sp", "*.lua", "*.lua.map"]

[tool.ruff]
line-length = 80
indent-width = 2
target-version = "py312"
exclude = [
    "sapphire/parser/gen",
    ".git",
    "__pycache__",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# TODO: Address E501 line-length violations in test files.
"*_test.py" = ["E501"]
# Embedded Python/Lua runtime source templates.
"sapphire/code_gen/python_runtime.py" = ["E501"]
"sapphire/code_gen/lua_runtime.py" = ["E501"]
