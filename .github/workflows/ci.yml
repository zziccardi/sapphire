name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      PIPENV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Lua)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Install ANTLR 4.13.2
        run: |
          sudo curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar -o /usr/local/lib/antlr-4.13.2-complete.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/antlr-4.13.2-complete.jar "$@"\n' | sudo tee /usr/local/bin/antlr > /dev/null
          sudo chmod +x /usr/local/bin/antlr

      - name: Install Pipenv
        run: pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv --python ${{ matrix.python-version }} install --dev --deploy || pipenv --python ${{ matrix.python-version }} install --dev --skip-lock

      - name: Verify ANTLR-generated parser files are up-to-date
        run: |
          pipenv run antlr
          git diff --exit-code src/parser/gen

      - name: Run Python unit tests
        run: pipenv run test

      - name: Run test coverage verification
        run: pipenv run coverage

      - name: Run Sapphire native E2E test runner
        run: pipenv run sapphire test

      - name: Verify sample programs
        run: pipenv run check-samples
