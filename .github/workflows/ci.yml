name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      PIPENV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Lua)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Install ANTLR 4.13.2
        run: |
          sudo curl -fsSL https://www.antlr.org/download/antlr-4.13.2-complete.jar -o /usr/local/lib/antlr-4.13.2-complete.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/antlr-4.13.2-complete.jar "$@"\n' | sudo tee /usr/local/bin/antlr > /dev/null
          sudo chmod +x /usr/local/bin/antlr

      - name: Install Pipenv
        run: pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv --python ${{ matrix.python-version }} install --dev --deploy || pipenv --python ${{ matrix.python-version }} install --dev --skip-lock

      - name: Verify ANTLR-generated parser files are up-to-date
        run: |
          pipenv run antlr
          git diff --exit-code src/parser/gen

      - name: Verify TextMate grammar is up-to-date
        run: |
          python3 tools/vscode-extension/scripts/generate_grammar.py
          git diff --exit-code tools/vscode-extension/syntaxes/sapphire.tmLanguage.json

      - name: Run Python unit tests
        run: pipenv run test

      - name: Run test coverage verification
        run: pipenv run coverage

      - name: Run Sapphire native E2E test runner (Python)
        run: pipenv run sapphire test

      - name: Run Sapphire native E2E test runner (Lua)
        run: pipenv run sapphire test -t lua

      - name: Verify sample programs
        run: pipenv run check-samples

  vscode-extension:
    name: Test VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: tools/vscode-extension
        run: npm ci

      - name: Run VS Code extension build & tests
        working-directory: tools/vscode-extension
        run: npm test

  web:
    name: Test & Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run website unit tests
        working-directory: web
        run: npm test

      - name: Build Astro site
        working-directory: web
        run: npm run build
