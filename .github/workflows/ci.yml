name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      PIPENV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pipenv
        run: pip install --upgrade pip pipenv

      - name: Install dependencies
        run: pipenv --python ${{ matrix.python-version }} install --dev --deploy || pipenv --python ${{ matrix.python-version }} install --dev --skip-lock

      - name: Run Python unit tests
        run: pipenv run test

      - name: Run test coverage verification
        run: pipenv run coverage

      - name: Run Sapphire native E2E test runner
        run: pipenv run sapphire test

      - name: Verify sample programs
        run: pipenv run check-samples
