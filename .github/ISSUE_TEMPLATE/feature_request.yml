name: Feature request
description: Suggest a language feature, stdlib addition, or tooling improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation / problem statement
      description: What problem or boilerplate are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Describe the syntax, semantics, or API you have in mind.
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Alignment with Sapphire's design goals
      description: >
        Note any impact on zero-vtable polymorphism, no struct up-casting,
        scope-bound memory safety, or Python/Lua/native backend parity.
